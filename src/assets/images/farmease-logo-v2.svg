<svg width="680" height="680" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <title>FarmEase Logo v2</title>
  <desc>FarmEase logo - a circular emblem with layered geometric rings, a central wheat and leaf illustration, and a glowing sun, all in deep green and gold tones</desc>

  <defs>
    <clipPath id="circleClip">
      <circle cx="340" cy="340" r="240"/>
    </clipPath>
  </defs>

  <!-- Outermost decorative ring -->
  <circle cx="340" cy="340" r="290" fill="none" stroke="#1a4a1a" stroke-width="6"/>
  <circle cx="340" cy="340" r="278" fill="none" stroke="#c8a030" stroke-width="2"/>

  <!-- Tick marks on outer ring -->
  <g stroke="#c8a030" stroke-width="2" stroke-linecap="round">
    <line x1="340" y1="52" x2="340" y2="66"/>
    <line x1="340" y1="614" x2="340" y2="628"/>
    <line x1="52" y1="340" x2="66" y2="340"/>
    <line x1="614" y1="340" x2="628" y2="340"/>
    <line x1="135" y1="135" x2="145" y2="145"/>
    <line x1="535" y1="135" x2="545" y2="145"/>
    <line x1="135" y1="545" x2="145" y2="535"/>
    <line x1="535" y1="545" x2="545" y2="535"/>
  </g>

  <!-- Main filled circle background -->
  <circle cx="340" cy="340" r="260" fill="#1c4a1c"/>
  <circle cx="340" cy="340" r="255" fill="none" stroke="#2d6a2d" stroke-width="3"/>

  <!-- Inner accent ring -->
  <circle cx="340" cy="340" r="240" fill="#234e23"/>

  <!-- Subtle concentric decorative arc lines -->
  <circle cx="340" cy="340" r="220" fill="none" stroke="#2d6a2d" stroke-width="1" opacity="0.6"/>
  <circle cx="340" cy="340" r="200" fill="none" stroke="#2d6a2d" stroke-width="0.8" opacity="0.4"/>

  <!-- Sky background inside circle -->
  <circle cx="340" cy="340" r="238" fill="#1a421a" clip-path="url(#circleClip)"/>

  <!-- Ground layer at bottom -->
  <ellipse cx="340" cy="500" rx="200" ry="60" fill="#2d6a1a" clip-path="url(#circleClip)"/>
  <ellipse cx="340" cy="495" rx="180" ry="40" fill="#3a7a22" clip-path="url(#circleClip)"/>

  <!-- Rolling hills -->
  <path d="M100 490 Q200 430 340 450 Q480 430 580 490 L580 560 L100 560Z" fill="#2d6a1a" clip-path="url(#circleClip)"/>
  <path d="M100 510 Q220 460 340 472 Q460 460 580 510 L580 580 L100 580Z" fill="#357a20" clip-path="url(#circleClip)"/>

  <!-- Sun glow rings -->
  <circle cx="340" cy="195" r="48" fill="#f5c842" opacity="0.12"/>
  <circle cx="340" cy="195" r="36" fill="#f5c842" opacity="0.22"/>
  <!-- Sun body -->
  <circle cx="340" cy="195" r="26" fill="#f9d460"/>
  <circle cx="340" cy="195" r="18" fill="#fde880"/>

  <!-- Sun rays -->
  <g stroke="#f5c842" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="340" y1="155" x2="340" y2="142"/>
    <line x1="374" y1="164" x2="382" y2="154"/>
    <line x1="393" y1="195" x2="408" y2="195"/>
    <line x1="374" y1="226" x2="382" y2="236"/>
    <line x1="306" y1="164" x2="298" y2="154"/>
    <line x1="287" y1="195" x2="272" y2="195"/>
    <line x1="306" y1="226" x2="298" y2="236"/>
    <line x1="364" y1="158" x2="370" y2="146"/>
    <line x1="316" y1="158" x2="310" y2="146"/>
  </g>

  <!-- Central wheat stalk -->
  <line x1="340" y1="488" x2="340" y2="270" stroke="#7abf3a" stroke-width="7" stroke-linecap="round"/>

  <!-- Wheat grains cluster -->
  <ellipse cx="340" cy="264" rx="12" ry="20" fill="#d4a830" transform="rotate(-8 340 264)"/>
  <ellipse cx="322" cy="276" rx="10" ry="17" fill="#c89e28" transform="rotate(-28 322 276)"/>
  <ellipse cx="358" cy="276" rx="10" ry="17" fill="#c89e28" transform="rotate(28 358 276)"/>
  <ellipse cx="312" cy="294" rx="9" ry="15" fill="#b88e20" transform="rotate(-40 312 294)"/>
  <ellipse cx="368" cy="294" rx="9" ry="15" fill="#b88e20" transform="rotate(40 368 294)"/>
  <ellipse cx="306" cy="313" rx="8" ry="13" fill="#a87e18" transform="rotate(-50 306 313)"/>
  <ellipse cx="374" cy="313" rx="8" ry="13" fill="#a87e18" transform="rotate(50 374 313)"/>
  <ellipse cx="302" cy="332" rx="7" ry="11" fill="#987010" transform="rotate(-55 302 332)"/>
  <ellipse cx="378" cy="332" rx="7" ry="11" fill="#987010" transform="rotate(55 378 332)"/>

  <!-- Awns -->
  <line x1="340" y1="248" x2="337" y2="230" stroke="#d4a030" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="328" y1="262" x2="316" y2="246" stroke="#c09020" stroke-width="2" stroke-linecap="round"/>
  <line x1="352" y1="262" x2="364" y2="246" stroke="#c09020" stroke-width="2" stroke-linecap="round"/>
  <line x1="318" y1="280" x2="304" y2="265" stroke="#b08010" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="362" y1="280" x2="376" y2="265" stroke="#b08010" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Large left leaf -->
  <path d="M340 400 Q290 370 265 330 Q278 338 300 355 Q318 370 340 400" fill="#4aaa28" opacity="0.95"/>
  <!-- Large right leaf -->
  <path d="M340 388 Q392 358 416 316 Q402 325 380 342 Q360 358 340 388" fill="#5aba32" opacity="0.95"/>

  <!-- Second left leaf lower -->
  <path d="M340 435 Q304 415 288 390 Q300 396 320 412 Q332 422 340 435" fill="#3a9a20" opacity="0.85"/>
  <!-- Second right leaf lower -->
  <path d="M340 428 Q376 408 392 382 Q380 390 360 406 Q350 415 340 428" fill="#4aaa28" opacity="0.85"/>

  <!-- Left side wheat stalk -->
  <line x1="290" y1="488" x2="290" y2="348" stroke="#5aa030" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="290" cy="344" rx="8" ry="13" fill="#c89e28" transform="rotate(-8 290 344)"/>
  <ellipse cx="278" cy="354" rx="7" ry="11" fill="#b88e20" transform="rotate(-28 278 354)"/>
  <ellipse cx="302" cy="354" rx="7" ry="11" fill="#b88e20" transform="rotate(28 302 354)"/>
  <ellipse cx="272" cy="367" rx="6" ry="9" fill="#a87e18" transform="rotate(-40 272 367)"/>
  <ellipse cx="308" cy="367" rx="6" ry="9" fill="#a87e18" transform="rotate(40 308 367)"/>
  <path d="M290 420 Q268 408 258 388 Q270 394 290 420" fill="#4aaa28" opacity="0.8"/>
  <path d="M290 412 Q312 400 320 378 Q310 386 290 412" fill="#5aba32" opacity="0.8"/>

  <!-- Right side wheat stalk -->
  <line x1="390" y1="488" x2="390" y2="348" stroke="#5aa030" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="390" cy="344" rx="8" ry="13" fill="#c89e28" transform="rotate(-8 390 344)"/>
  <ellipse cx="378" cy="354" rx="7" ry="11" fill="#b88e20" transform="rotate(-28 378 354)"/>
  <ellipse cx="402" cy="354" rx="7" ry="11" fill="#b88e20" transform="rotate(28 402 354)"/>
  <ellipse cx="372" cy="367" rx="6" ry="9" fill="#a87e18" transform="rotate(-40 372 367)"/>
  <ellipse cx="408" cy="367" rx="6" ry="9" fill="#a87e18" transform="rotate(40 408 367)"/>
  <path d="M390 420 Q368 408 358 388 Q370 394 390 420" fill="#4aaa28" opacity="0.8"/>
  <path d="M390 412 Q412 400 420 378 Q410 386 390 412" fill="#5aba32" opacity="0.8"/>

  <!-- Ground grass tufts -->
  <path d="M260 490 Q255 470 250 460 Q258 470 265 490Z" fill="#5aaa28"/>
  <path d="M275 490 Q272 468 268 455 Q278 468 282 490Z" fill="#6aba30"/>
  <path d="M310 490 Q306 472 302 462 Q312 472 316 490Z" fill="#5aaa28"/>
  <path d="M370 490 Q374 472 378 462 Q368 472 364 490Z" fill="#5aaa28"/>
  <path d="M405 490 Q408 468 412 455 Q402 468 398 490Z" fill="#6aba30"/>
  <path d="M420 490 Q425 470 430 460 Q422 470 415 490Z" fill="#5aaa28"/>

  <!-- Gold bottom arc decoration -->
  <path d="M160 520 Q340 580 520 520" fill="none" stroke="#c8a030" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M180 535 Q340 590 500 535" fill="none" stroke="#c8a030" stroke-width="1" stroke-linecap="round" opacity="0.35"/>

  <!-- Gold decorative dots on outer ring -->
  <circle cx="340" cy="62" r="4" fill="#c8a030"/>
  <circle cx="340" cy="618" r="4" fill="#c8a030"/>
  <circle cx="62" cy="340" r="4" fill="#c8a030"/>
  <circle cx="618" cy="340" r="4" fill="#c8a030"/>

  <!-- Small leaf accents at sides of inner circle -->
  <path d="M102 340 Q118 328 134 340 Q118 352 102 340" fill="#4aaa28" opacity="0.7"/>
  <path d="M578 340 Q562 328 546 340 Q562 352 578 340" fill="#4aaa28" opacity="0.7"/>

</svg>
